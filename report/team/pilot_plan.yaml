# BHD · Gate 2a · Lịch đề xuất, giờ Việt Nam
# D1 · α = 0,05 hai phía, power = 0,80, ICC = 0,02, baseline = 0,70.
# a. Mức tăng 5 điểm cần 1.251 yêu cầu độc lập mỗi nhánh.
# b. Với m = 75, DE = 2,48. Cần 3.103 yêu cầu và 42 người/nhánh, tổng 84 > 40.
# c. Với 20 người/nhánh, n hiệu dụng < 20/0,02 = 1.000, thấp hơn 1.251.
# d. Với 6 depot/nhánh, n hiệu dụng < 6/0,02 = 300.
# e. Với mục tiêu 859 hiệu dụng, 20m/(0,98 + 0,02m) >= 859 cho m >= 299.
#    20 × 299 = 5.980 yêu cầu/nhánh, DE = 6,96, n hiệu dụng = 859,20.
# D2 · Năm câu kiểm tra
# 1. Hai nhánh hoạt động đồng thời trong cùng 12 depot và cùng cửa sổ tuyển mẫu.
# 2. Xáo trộn theo depot với seed đã khóa, chia 20 người/nhánh trước ngày mở.
# 3. Khóa quyền theo tài khoản, theo dõi truy cập chéo và cấm chia sẻ gợi ý.
# 4. Khóa chỉ số, ngưỡng, cửa sổ theo dõi và ngày xét trước khi mời ca đầu tiên.
# 5. Mỗi nhánh có 20 cụm nhân viên. Chỉ phân tích theo nhánh được phân ban đầu.
# Đánh đổi: thiết kế đủ lực cho 6 điểm. Nếu tăng thật 5 điểm, power chỉ khoảng 0,642.
# Chạy thử mở lại 51/1.200 = 4,25%, trong phạm vi 39/982 = 3,97%. Trần đề xuất 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Yêu cầu noi_dia và hang_nang tại 12 depot, tổng 40 nhân viên. Trong mẫu hai loại này có 900/982 việc thành công. Quốc tế và đối tác tiếp tục theo luồng nhân viên."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    seed: 13021
    method: "Khóa danh sách nhân viên trước khi chia. Xáo trong mỗi depot, ghép cặp và bốc một người mỗi cặp vào mỗi nhánh. Chia ngẫu nhiên các suất lẻ sao cho tổng mỗi nhánh bằng 20."
  rollout: [0.10, 0.25, 0.50]
  rollout_schedule: "Từ 30/11/2026 mở cho 4, rồi 10, rồi 20 người trong nhánh can thiệp. Mỗi bậc ít nhất 7 ngày. Đủ dữ liệu an toàn đã trưởng thành mới lên bậc. 20 đối chứng làm thủ công suốt pilot."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859  # cỡ mẫu hiệu dụng mục tiêu
    design_effect: 6.96
    clusters_per_arm: 20
    min_requests_per_staff: 299
    raw_requests_per_arm: 5980
  identifiability:
    concurrent_control: "Chỉ đưa vào so sánh chính các ca đủ điều kiện phát sinh ở cả hai nhánh trong cùng thời gian từ bậc 0,50 đến hết 10/01/2027."
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ cách xử lý. Chặn mở trợ lý với tài khoản đối chứng, đối soát event theo staff_id và ghi sự cố chia sẻ."
    predeclared: "Khóa kế hoạch trước 30/11/2026. So chênh lệch tỉ lệ giữa hai nhánh theo phân công ban đầu, tính khoảng tin cậy 95% có xét cụm nhân viên và phân tầng depot."
  stop_rules:
    - "NẾU tỉ lệ mở lại của can thiệp vượt 6% hoặc cao hơn đối chứng từ 2 điểm phần trăm TRONG 1 cửa sổ 7 ngày đã đủ theo dõi, tối thiểu 100 yêu cầu mỗi nhánh, THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ giữ bậc hiện tại đến khi đủ mẫu và qua các kiểm tra vận hành."
    - "NẾU phát hiện từ 1 lần hoàn trùng hoặc báo đã hoàn khi sổ cái chưa ghi thành công TRONG bất kỳ lần đối soát nào THÌ Kỹ sư trưởng khóa ngay luồng ghi hoàn và gọi Giám đốc vận hành để quay về xử lý tay KHÔNG THÌ tiếp tục đối soát hằng giờ, chưa được bỏ khóa chống trùng."
    - "NẾU biến phí đo thực trên việc thành công vượt 12.000 đ hoặc không có việc thành công dù có chi phí TRONG 2 tuần liên tiếp THÌ Giám đốc vận hành dừng tuyển ca và yêu cầu PM rà soát phút xem lại, làm lại KHÔNG THÌ tiếp tục theo dõi và cấm mở rộng ngoài phạm vi."
    - "NẾU số quyết định sửa hoặc bỏ vượt 40% số ca đã xem TRONG 1 tuần có từ 30 quyết định THÌ Trưởng nhóm CSKH giữ bậc, kiểm 20 trace và huấn luyện trước khi mở lại KHÔNG THÌ duy trì giám sát, chưa tăng bậc nếu thiếu quyết định hoặc chưa qua kiểm tra an toàn."
  interim_looks: "Chỉ kiểm tra an toàn giữa kỳ. Chi phí và sử dụng là điều kiện vận hành. Khóa kết quả chỉ số chính đến ngày quyết định."
  rollback: "Giám đốc vận hành tắt cờ trong 30 phút. Chuyển ca mới và ca đang mở cho nhân viên cùng lịch sử. Kế toán đối soát mọi lệnh đang chờ trước khi cho phép xử lý tiền tiếp."
  decision_date: "2027-01-19"
  decision_rule: "Ngày 19/01 so hai nhánh sau khi ca cuối đã có 24 giờ để đóng và 7 ngày theo dõi tiếp. Chỉ đề nghị mở rộng nếu đủ 299 ca/người, mức tăng quan sát ít nhất 5 điểm, cận dưới khoảng tin cậy 95% lớn hơn 0 và qua các luật dừng. Thiếu mẫu hoặc thiếu thời gian theo dõi thì ghi chưa đủ bằng chứng."
  simulated_inputs:
    - "phut_xem_lai_simulated và phut_lam_lai_simulated dùng định giá quá khứ. Từ ngày đầu ghi phút thực, đối chiếu sau tuần 1."
    - "CPS toàn mẫu 4.472 đ, trong phạm vi 3.414 đ (simulated, chưa cộng cố định)."
    - "B4 xem lại 5 phút cho mỗi câu trả lời, làm lại 9 hoặc 15,3 phút/ca, cho CPS 11.743 hoặc 12.415 đ (simulated)."
